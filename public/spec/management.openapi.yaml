openapi: 3.1.0
info:
  title: Liapoldus Gateway Management API
  version: 1.0.0
  description: >-
    Control-plane API единственного Core instance. Desired plugin configuration
    хранится в SQLite и push-ится по pluginprotocol ConfigApply. Public traffic
    не проходит через этот API. Caddy Admin/group/TLS endpoints отсутствуют.
servers:
  - url: /
security:
  - ServiceBearer: []
paths:
  /healthz:
    get:
      operationId: healthz
      security: []
      summary: Проверить процесс Core
      responses:
        '200':
          description: Core process отвечает
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /api/status:
    get:
      operationId: getStatus
      summary: Получить Core profile и readiness summary
      responses:
        '200':
          description: Текущее состояние control plane
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoreStatus' }
  /api/plugins:
    get:
      operationId: listPlugins
      summary: Список подключённых plugin instances
      responses:
        '200':
          description: Metadata без секретов и private keys
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginList' }
    post:
      operationId: createPlugin
      summary: Создать plugin instance desired state
      description: >-
        Профиль берётся из bootstrap. supervised принимает catalog release
        reference; external принимает fixed replica endpoints и ожидаемую
        identity. Содержимое application settings меняется отдельным settings
        endpoint. Core не принимает произвольный package URL.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginCreate' }
      responses:
        '202':
          description: Desired instance записан; возвращена operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationAccepted' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/plugins/{pluginId}:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    get:
      operationId: getPlugin
      summary: Получить plugin instance metadata
      responses:
        '200':
          description: Redacted plugin instance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginInstance' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updatePlugin
      summary: Обновить generic endpoint или installation release reference
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginDesiredState' }
      responses:
        '202':
          description: Изменение принято как durable operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationAccepted' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      operationId: deletePlugin
      summary: Удалить desired plugin instance
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Instance удаляется; supervised lifecycle завершается Core, external — оператором
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationAccepted' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /api/plugins/{pluginId}/settings:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    get:
      operationId: getPluginSettings
      summary: Получить desired JSON settings и revision
      responses:
        '200':
          description: Versioned plugin config; secret values не возвращаются
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginSettings' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: applyPluginSettings
      summary: Сохранить и push-ить plugin settings через ConfigApply
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginSettingsInput' }
      responses:
        '202':
          description: Candidate apply начат; активируется после обязательных ACK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationAccepted' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/plugins/{pluginId}/install:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    post:
      operationId: installPluginRelease
      summary: Установить подписанный release в supervised profile
      description: В external profile операция запрещена. Запрос содержит только catalog identity и version, не URL.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginReleaseSelection' }
      responses:
        '202':
          description: TUF verification/install operation создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationAccepted' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/plugins/{pluginId}/restart:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    post:
      operationId: restartPlugin
      summary: Перезапустить supervised plugin
      description: В external profile process lifecycle принадлежит оператору, поэтому операция запрещена.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Restart operation создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationAccepted' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/plugins/{pluginId}/interactions:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    get:
      operationId: getPluginInteractions
      summary: Получить outbound allow-list caller instance
      responses:
        '200':
          description: Desired explicit plugin-to-plugin edges
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InteractionPolicy' }
    put:
      operationId: applyPluginInteractions
      summary: Заменить outbound allow-list с generation/CAS
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InteractionPolicyInput' }
      responses:
        '202':
          description: Policy generation отправляется всем участникам
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationAccepted' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/plugins/{pluginId}/cookie-policies/{capability}:
    parameters:
      - $ref: '#/components/parameters/PluginId'
      - name: capability
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getPluginCookiePolicy
      summary: Получить входную cookie allow-list
      responses:
        '200':
          description: Policy для пары instance/capability
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CookiePolicy' }
    put:
      operationId: replacePluginCookiePolicy
      summary: Заменить cookie allow-list с CAS/audit
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CookiePolicyInput' }
      responses:
        '200':
          description: Активная policy и новый ETag
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CookiePolicy' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/plugins/{pluginId}/admin/surface:
    parameters:
      - $ref: '#/components/parameters/PluginId'
    get:
      operationId: getPluginAdminSurface
      summary: Получить validated plugin Admin Surface
      responses:
        '200':
          description: Declarative surface без executable UI
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/plugins/{pluginId}/admin/pages/{page}/query:
    parameters:
      - $ref: '#/components/parameters/PluginId'
      - name: page
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/IfMatch'
    post:
      operationId: queryPluginAdminPage
      summary: Выполнить schema-bound Admin Surface query
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Typed JSON query result
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/plugins/{pluginId}/admin/pages/{page}/actions/{action}:
    parameters:
      - $ref: '#/components/parameters/PluginId'
      - name: page
        in: path
        required: true
        schema: { type: string }
      - name: action
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      operationId: executePluginAdminAction
      summary: Выполнить объявленное plugin action
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Typed action result
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/operations/{operationId}:
    parameters:
      - name: operationId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getOperation
      summary: Получить состояние durable operation
      responses:
        '200':
          description: Operation metadata only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/audit:
    get:
      operationId: listAudit
      summary: Получить cursor page audit events
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Redacted audit page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
  /api/access/service-keys:
    get:
      operationId: listServiceKeys
      summary: Список metadata service credentials
      responses:
        '200':
          description: Token и verifier не возвращаются
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
    post:
      operationId: createServiceKey
      summary: Выпустить platform-admin service credential
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '201':
          description: Raw token показывается только один раз
          content:
            application/json:
              schema: { type: object, required: [id, token], properties: { id: { type: string }, token: { type: string } }, additionalProperties: false }
  /api/access/service-keys/{keyId}/rotate:
    post:
      operationId: rotateServiceKey
      summary: Ротировать service credential
      parameters:
        - name: keyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Новый raw token показывается один раз
          content:
            application/json:
              schema: { type: object, required: [id, token], properties: { id: { type: string }, token: { type: string } }, additionalProperties: false }
  /api/access/service-keys/{keyId}/revoke:
    post:
      operationId: revokeServiceKey
      summary: Отозвать service credential
      parameters:
        - name: keyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Credential отозван }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    ServiceBearer:
      type: http
      scheme: bearer
      description: TLS обязателен; web также требует клиентский mTLS. Bearer token никогда не выдаётся browser.
  parameters:
    PluginId:
      name: pluginId
      in: path
      required: true
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
      description: Strong ETag текущего ресурса.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  responses:
    Conflict:
      description: CAS, idempotency или resource state conflict
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: If-Match не соответствует актуальной revision
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Invalid:
      description: Невалидный request или plugin schema
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource не найден
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: Plugin/control service временно недоступен
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
      additionalProperties: false
    CoreStatus:
      type: object
      required: [profile, state, plugins]
      properties:
        profile: { type: string, enum: [supervised, external] }
        state: { type: string, enum: [ready, degraded, recovering, unavailable] }
        plugins: { type: object, additionalProperties: { type: string } }
      additionalProperties: false
    PluginCreate:
      type: object
      required: [id]
      properties:
        id: { type: string, minLength: 1 }
        release: { $ref: '#/components/schemas/PluginReleaseSelection' }
        replicas:
          type: array
          items: { $ref: '#/components/schemas/PluginReplicaInput' }
      additionalProperties: false
    PluginDesiredState:
      type: object
      properties:
        release: { $ref: '#/components/schemas/PluginReleaseSelection' }
        replicas:
          type: array
          items: { $ref: '#/components/schemas/PluginReplicaInput' }
      additionalProperties: false
    PluginReplicaInput:
      type: object
      required: [endpoint, expectedIdentity]
      properties:
        endpoint: { type: string, format: uri }
        expectedIdentity: { type: string, minLength: 1 }
      additionalProperties: false
    PluginReleaseSelection:
      type: object
      required: [publisher, name, version]
      properties:
        publisher: { type: string }
        name: { type: string }
        version: { type: string }
      additionalProperties: false
    PluginInstance:
      type: object
      required: [id, state, desiredGeneration, appliedGeneration]
      properties:
        id: { type: string }
        state: { type: string }
        manifestDigest: { type: string }
        releaseDigest: { type: string }
        desiredGeneration: { type: integer, minimum: 0 }
        appliedGeneration: { type: integer, minimum: 0 }
        replicas: { type: array, items: { type: object, additionalProperties: true } }
      additionalProperties: false
    PluginList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PluginInstance' } }
        nextCursor: { type: [string, 'null'] }
      additionalProperties: false
    PluginSettings:
      type: object
      required: [revision, config]
      properties:
        revision: { type: string }
        digest: { type: string }
        config: { type: object, additionalProperties: true }
      additionalProperties: false
    PluginSettingsInput:
      type: object
      required: [config]
      properties:
        config: { type: object, additionalProperties: true }
      additionalProperties: false
    InteractionPolicy:
      type: object
      required: [generation, edges]
      properties:
        generation: { type: integer, minimum: 0 }
        edges: { type: array, items: { $ref: '#/components/schemas/InteractionEdge' } }
      additionalProperties: false
    InteractionPolicyInput:
      type: object
      required: [edges]
      properties:
        edges: { type: array, items: { $ref: '#/components/schemas/InteractionEdge' } }
      additionalProperties: false
    InteractionEdge:
      type: object
      required: [targetInstance, capability, mode]
      properties:
        targetInstance: { type: string }
        capability: { type: string }
        mode: { type: string }
      additionalProperties: false
    CookiePolicy:
      type: object
      required: [instanceId, capability, revision, allowedNames]
      properties:
        instanceId: { type: string }
        capability: { type: string }
        revision: { type: integer, minimum: 0 }
        allowedNames: { type: array, items: { type: string } }
      additionalProperties: false
    CookiePolicyInput:
      type: object
      required: [allowedNames]
      properties:
        allowedNames: { type: array, uniqueItems: true, items: { type: string } }
      additionalProperties: false
    OperationAccepted:
      type: object
      required: [operationId, state]
      properties:
        operationId: { type: string }
        state: { type: string, enum: [pending, running] }
      additionalProperties: false
    Operation:
      type: object
      required: [id, kind, state, createdAt, updatedAt]
      properties:
        id: { type: string }
        kind: { type: string }
        state: { type: string }
        resourceId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        errorCode: { type: string }
      additionalProperties: false
    AuditPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { type: object, additionalProperties: true } }
        nextCursor: { type: [string, 'null'] }
      additionalProperties: false
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        requestId: { type: string }
      additionalProperties: false
